aid: agriprotein
name: Agriprotein
description: >-
  AgriProtein was a South African industrial insect-farming company, founded in Cape Town in
  2008, that pioneered commercial black soldier fly (Hermetia illucens) bioconversion: it fed
  organic waste from food factories, supermarkets, farms and restaurants to fly larvae and
  processed the result into MagMeal insect protein for aquaculture, poultry and pet food,
  MagOil, and MagSoil soil conditioner. It opened the world's first full-scale BSF facility in
  Philippi, Cape Town in 2014 and raised USD 105 million in 2018 to build out a global factory
  network. Its UK parent, Insect Technology Group, entered administration in February 2021 and
  the group's assets, intellectual property and plant were sold in June 2021. The company is
  defunct; it published no developer program, API, or machine-readable specification, and the
  agriprotein.com domain has since lapsed to an unrelated operator.
